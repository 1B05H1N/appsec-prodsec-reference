name: Learning guide
on:
  push:
    paths:
      - "docs/**"
      - "tests/gradients-to-rag.test.cjs"
      - ".github/workflows/learning-guide.yml"
  pull_request:
    paths:
      - "docs/**"
      - "tests/gradients-to-rag.test.cjs"
      - ".github/workflows/learning-guide.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: node --test tests/gradients-to-rag.test.cjs
